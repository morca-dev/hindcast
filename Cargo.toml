[package]
name = "hindcast-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hindcast's worker: GFS 2 m temperature forecasts into Iceberg, a morca step in Rust."

[lib]
# libhindcast_worker.so (.dylib on macOS), which pipelines/hindcast.mojo loads.
# The crate's source is worker/, beside the Mojo pipeline's.
path = "worker/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The morca the pipeline pins (pixi.toml's morca-mojo): the ABI version is
# checked when the step runs. Move the two together.
morca-worker = { git = "https://github.com/morca-dev/morca", tag = "v0.32.0" }
# Pure Rust only, so the library links nothing but libc and fits the
# distroless runtime image: no openjpeg or libaec (GFS 2 m temperature is
# template 5.3, which grib decodes itself; these features cover the rest).
grib = { version = "0.20.3", default-features = false, features = ["jpeg2000-unpack-with-hayro", "png-unpack-with-png-crate", "ccsds-unpack-with-rust-aec"] }
# rustls with webpki's roots: no OpenSSL, and no CA files needed at run time.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
